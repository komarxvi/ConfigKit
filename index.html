<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ConfigKit — Configuration Profile Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230071e3'/%3E%3Cpath d='M42 24a14 14 0 1 0 0 16' fill='none' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">

    <meta name="description" content="A simple web-based generator for Apple configuration profiles (.mobileconfig).">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ConfigKit">

    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>ConfigKit <span class="version">v2.4</span></h1>
            <p class="subtitle">A simple web-based generator for Apple configuration profiles (.mobileconfig).</p>
        </header>

        <div class="section-title">Profile Settings</div>

        <section class="card" aria-labelledby="lockscreen-title">
            <div class="card-header">
                <h2 id="lockscreen-title">Lock Screen</h2>
            </div>

            <div class="phone-preview" aria-hidden="true">
                <div class="phone-controls">
                    <span class="side-orb"></span>
                    <span class="side-orb"></span>
                </div>
                <span class="phone-footnote" id="phone-footnote">Swipe Up to Unlock</span>
                <span class="home-indicator"></span>
            </div>

            <label for="footnote-input">Lock screen message</label>
            <div class="input-wrap">
                <textarea
                    id="footnote-input"
                    rows="3"
                    maxlength="250"
                    placeholder="Swipe Up to Unlock"
                    spellcheck="false"
                    autocomplete="off"></textarea>
                <span class="char-count" id="char-count">0 / 250</span>
            </div>
        </section>

        <section class="card restrictions-card" id="restrictions-card">
            <button
                type="button"
                class="disclosure-summary"
                id="restrictions-toggle"
                aria-expanded="false"
                aria-controls="restrictions-content">
                <span class="disclosure-copy">
                    <span class="disclosure-title">Restrictions</span>
                    <span class="card-subtitle">Turn on what should be blocked</span>
                </span>
                <span class="restriction-icons">
                    <svg class="restriction-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path class="ri-horizontal" d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                        <path class="ri-vertical" d="M12 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </span>
            </button>

            <div class="disclosure-content" id="restrictions-content">
                <div class="disclosure-inner">
                    <div class="toggle-list" role="group" aria-label="System restrictions">
                        <label class="toggle-row">
                            <span class="toggle-copy">
                                <span class="toggle-label">Camera</span>
                                <span class="toggle-hint">Block photo and video capture</span>
                            </span>
                            <input type="checkbox" id="toggle-camera" class="ios-toggle">
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-copy">
                                <span class="toggle-label">Siri Assistant</span>
                                <span class="toggle-hint">Block the virtual assistant</span>
                            </span>
                            <input type="checkbox" id="toggle-siri" class="ios-toggle">
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-copy">
                                <span class="toggle-label">Screenshots</span>
                                <span class="toggle-hint">Block screen and app capture</span>
                            </span>
                            <input type="checkbox" id="toggle-screenshot" class="ios-toggle">
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-copy">
                                <span class="toggle-label">AirDrop</span>
                                <span class="toggle-hint">Block wireless file sharing</span>
                            </span>
                            <input type="checkbox" id="toggle-airdrop" class="ios-toggle">
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-copy">
                                <span class="toggle-label">App Removal</span>
                                <span class="toggle-hint">Block deleting installed apps</span>
                            </span>
                            <input type="checkbox" id="toggle-app-removal" class="ios-toggle">
                        </label>
                        <label class="toggle-row">
                            <span class="toggle-copy">
                                <span class="toggle-label">Safari</span>
                                <span class="toggle-hint">Block the Safari browser</span>
                            </span>
                            <input type="checkbox" id="toggle-safari" class="ios-toggle">
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <details class="preview-card" id="preview-card">
            <summary>
                <span>Live XML Preview</span>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </summary>
            <pre><code id="xml-preview"></code></pre>
            <button id="copy-button" type="button">Copy XML</button>
        </details>

        <div class="action-bar">
            <button id="generate-button" type="button" aria-live="polite">Generate .mobileconfig</button>
        </div>
    </main>

    <div class="page-note">
        <p class="supervision-note">This will only work if supervision is enabled on the device.</p>
    </div>

    <footer class="app-footer">
        <a href="https://github.com/komarxvi" target="_blank" rel="noopener noreferrer">github.com/komarxvi</a>
    </footer>

    <script src="app.js"></script>
</body>
</html>
